<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无缝滚动</title>
  <script src="../../base/dist/umd/index.min.cjs"></script>
  <script src="../dist/umd/index.min.cjs"></script>
  <style>
    #demo-wrapper{
      
     
    }
  </style>
</head>
<body>
  <canvas id="img-code"></canvas>
  <button id="demo">刷新</button>
  <div id="jianting" style="height: 2000px;"></div>
  <div id="img-test01" style="width: 200px;height:200px;background: red;"></div>
  <script>
    
    const iCode = jUtilsBrowser.graphicalVerificationCode(document.getElementById('img-code'))
    function updateImg () {
      const text = iCode.refresh()
      console.log("验证码", text)
    }

    updateImg()

    const imgTest01 = document.getElementById('img-test01')

    jUtilsBrowser.lazyContainer(imgTest01, function () {
      console.log("改变图片")
    })
    document.getElementById('demo').onclick = function () {
      document.getElementById('jianting').style.height = 0
      updateImg()
    }
  </script>
</body>
</html>
