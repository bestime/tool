<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easyPostMessage页面二</title>
  <script src="../../base/dist/umd/index.min.cjs"></script>
  <script src="../dist/umd/index.min.cjs"></script>
  <style>
    #demo-wrapper{
      
     
    }
  </style>
</head>
<body>
  <h1>你好</h1>
  <button id="demo">发送消息</button>
  <script>    
    let count = 0
    const iEasyMessage = jUtilsBrowser.easyPostMessage('子页面',window.parent, {
      onMessage: function (data) {
        console.log("w2 收到消息", data)
        iEasyMessage.send({
          requestId: data.id,
          key: 'reply',
          data: "W2 回复 " + data.id
        })
      }
    })
    document.getElementById('demo').onclick = function () {
      const message = {
        requestId: 'W2 → ' + jUtilsBase.uuid(),
        key: 'chat',
        data: "W2 → " + count++
      }
      iEasyMessage.send(message)
    }
    iEasyMessage.send({
      key: 'infraReady',

      data: '初始化'
    })

    
  </script>
</body>
</html>
