<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件预览插件</title>
  <script src="../../dist/umd/index.min.cjs"></script>
  <style>
    #pdf-room {
      width: 200px;
      height: 200px;
      border: red solid 1px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <canvas width="200" height="200" id="pdf-room"></canvas>
  <script>
    const testUrl = 'http://127.0.0.1:5001/static/files/%E5%A4%A9%E7%84%B6%E6%B0%94%E8%B5%84%E8%AE%AF%E5%91%A8%E6%8A%A52023%E5%B9%B4%E7%AC%AC38%E6%9C%9F.pdf'
    const pdfRoom = document.getElementById('pdf-room')
    jUtilsBrowser.pdfToImage(testUrl, pdfRoom, {
      index: './pdf.min.mjs',
      worker: './pdf.worker.mjs',
    })
  </script>
</body>
</html>
