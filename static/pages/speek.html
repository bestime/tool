<html lang="en">
<head>

<body>
  <input id="msgiput" value="“2013年11月，具有划时代意义的党的十八届三中全会通过了《中共中央关于全面深化改革若干重大问题的决定》，首次提出完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化这一全面深化改革的总目标。治理国家，制度是起根本性、全局性、长远性作用的。习近平总书记指出：“前半程我们的主要历史任务是建立社会主义基本制度，并在这个基础上进行改革”“后半程，我们的主要历史任务是完善和发展中国特色社会主义制度，为党和国家事业发展、为人民幸福安康、为社会和谐稳定、为国家长治久安提供一整套更完备、更稳定、更管用的制度体系”。"/>
  <button id="test-ls">朗读</button>
  <script>
    const ipt = document.getElementById('msgiput')
    document.getElementById('test-ls').onclick = function () {
      jUtilsBrowser.speakText(ipt.value, {
        language: 'Google UK English Male'
      })
    }
    

    
  </script>
